services:
  backend:
    build:
      context: ./backend
    environment:
      LATTICE_DB_PATH: /app/data/lattice_index.sqlite3
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend
